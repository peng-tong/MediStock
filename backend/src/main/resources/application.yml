server:
  port: 8080

spring:
  datasource:
    driver-class-name: org.sqlite.JDBC
    # SQLite PRAGMA 通过 JDBC URL 参数设置：connection-init-sql 多语句会被 sqlite-jdbc 静默丢弃，导致外键不生效
    # WAL 提升并发读，busy_timeout 避免写锁冲突立刻报错，foreign_keys=on 保证外键约束
    url: jdbc:sqlite:./data/medistock.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
    hikari:
      # SQLite 单写者：连接池串行写
      maximum-pool-size: 10
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  # 启动时执行建表脚本（SQLite 生产 DDL）
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      # 逻辑删除
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      # 主键自增
      id-type: auto

# JWT 密钥：默认值为随机生成的强密钥，生产环境务必用环境变量 JWT_SECRET 覆盖
jwt:
  secret: ${JWT_SECRET:wRut+ppOLRV5ZQ7d2tdgE1v6aFOt8zPOZ+BsGavjl+Zl0zsOTRJGUjB4rtLYtBDH}
  expire-hours: 24
